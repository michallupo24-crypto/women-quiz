<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>איזו פורצת דרך את?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one centered quiz card on a soft pink stage — intro, four questions, result. A points chip rides along
   so the variable is always visible; the result can open a code peek that shows which if/else branch ran. */
:root{
  --bg:#FFE9EF; --bg2:#EFE9FF; --card:#FFFFFF; --ink:#2E2B33; --muted:#6E6573; --line:#F1D7E0;
  --pink:#FF7D9C; --purple:#715CF3; --teal:#1F9E8A; --gold:#F2C94C;
  --c1:#E8578C; --c1s:#FFE1EC; --c2:#715CF3; --c2s:#ECE8FF; --c3:#1F9E8A; --c3s:#DDF5F0;
  --code-bg:#2F2D33; --code-fg:#F3EEF5; --c-kw:#B9A8FF; --c-str:#FFB3C7; --c-fn:#8FD3FF; --c-num:#FFD58A; --c-com:#958D9B;
  --f-display:"Secular One","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1A20; --bg2:#221E2C; --card:#28242C; --ink:#F5EFF3; --muted:#B5ABB8; --line:#3B3240;
  --c1s:#40222F; --c2s:#2E2945; --c3s:#1D3A35; --code-bg:#141216; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1D1A20; --bg2:#221E2C; --card:#28242C; --ink:#F5EFF3; --muted:#B5ABB8; --line:#3B3240;
  --c1s:#40222F; --c2s:#2E2945; --c3s:#1D3A35; --code-bg:#141216; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{direction:rtl;margin:0;font-family:var(--f-body);font-size:17px;line-height:1.6;color:var(--ink);
  background:radial-gradient(1200px 600px at 100% 0,var(--bg2),transparent 60%),var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.app{max-width:640px;margin:0 auto;display:grid;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.top b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--ink)}
.pts{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 12px;font-family:var(--f-code);font-size:14px;direction:ltr;box-shadow:0 4px 14px #9b1f4814}
.pts b{font-size:16px;color:var(--purple)}
.pts .add{color:var(--teal);font-weight:700;animation:up .7s ease both}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.card{background:var(--card);border-radius:28px;padding:clamp(20px,5vw,34px);box-shadow:0 24px 50px #9b1f481a;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.12;text-wrap:balance}
.btn{border:0;border-radius:999px;padding:13px 28px;font-weight:700;font-size:17px;cursor:pointer;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--purple);color:#fff}
.btn.soft{background:var(--c2s);color:var(--purple)}
.btn.ghost{background:transparent;color:var(--muted);padding:13px 12px;font-weight:500}

/* intro */
.intro{display:grid;gap:18px;justify-items:center;text-align:center}
.collage{position:relative;width:min(360px,100%);height:200px}
.collage img{position:absolute;width:min(150px,44%);aspect-ratio:1;height:auto;object-fit:cover;border-radius:50%;border:6px solid var(--card);box-shadow:0 10px 24px #2e2b3326}
.collage img:nth-child(1){right:0;top:10px;transform:rotate(6deg)}
.collage img:nth-child(2){left:50%;top:40px;margin-left:-75px;z-index:2}
.collage img:nth-child(3){left:0;top:4px;transform:rotate(-6deg)}
.qmark{position:absolute;z-index:3;left:50%;top:-6px;transform:translateX(-50%) rotate(-8deg);background:var(--gold);color:#2E2B33;font-family:var(--f-display);font-size:30px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:4px solid var(--card)}
.eyebrow{font-size:13.5px;font-weight:700;letter-spacing:.06em;color:var(--pink)}
.intro h1{font-size:clamp(46px,11vw,72px)}
.intro p{margin:0;color:var(--muted);max-width:34ch}
.facts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.facts span{background:var(--bg);border-radius:999px;padding:4px 12px;font-size:14px}

/* question */
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:999px;transition:width .4s ease}
.qhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin:18px 0 18px}
.qicon{width:76px;height:76px;border-radius:22px;background:var(--bg);display:grid;place-items:center}
.qicon svg{width:52px;height:52px}
.qnum{font-size:14px;color:var(--muted)}
.qtext{font-size:clamp(26px,5.6vw,34px)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:right;font-size:17px;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:var(--card);cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
.opt:hover{transform:translateX(-3px)}
.opt .nb{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--f-code);font-weight:700}
.opt.o1 .nb{background:var(--c1)}.opt.o2 .nb{background:var(--c2)}.opt.o3 .nb{background:var(--c3)}
.opt.o1:hover{border-color:var(--c1)}.opt.o2:hover{border-color:var(--c2)}.opt.o3:hover{border-color:var(--c3)}
.opt.picked.o1{background:var(--c1s);border-color:var(--c1)}.opt.picked.o2{background:var(--c2s);border-color:var(--c2)}.opt.picked.o3{background:var(--c3s);border-color:var(--c3)}
.opt.picked .nb{animation:pick .35s ease}
@keyframes pick{50%{transform:scale(1.25) rotate(-8deg)}}
.opt .pt{margin-inline-start:auto;unicode-bidi:isolate;font-size:13px;color:var(--muted);font-family:var(--f-code);direction:ltr}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13.5px;color:var(--muted)}

/* result */
.result{padding:0;overflow:hidden}
.photo{position:relative;aspect-ratio:4/3;max-height:340px;width:100%;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block;animation:zoom 6s ease-out both}
@keyframes zoom{from{transform:scale(1.12)}}
.photo .badge{position:absolute;bottom:14px;right:14px;background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;box-shadow:0 6px 16px #0003}
.rbody{padding:clamp(20px,5vw,30px);display:grid;gap:12px}
.rbody .eyebrow{color:var(--muted)}
.rbody h2{font-size:clamp(40px,9vw,58px)}
.r1 h2{color:var(--c1)}.r2 h2{color:var(--c2)}.r3 h2{color:var(--c3)}
.rbody p{margin:0;font-size:18px;line-height:1.75}
.traits{display:flex;gap:8px;flex-wrap:wrap}
.traits span{border-radius:999px;padding:4px 12px;font-size:14px;font-weight:500}
.r1 .traits span{background:var(--c1s)}.r2 .traits span{background:var(--c2s)}.r3 .traits span{background:var(--c3s)}
.scale{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;direction:ltr;margin-top:4px}
.scale i{height:30px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-family:var(--f-code);font-size:12.5px;font-weight:600;color:#fff;opacity:.35}
.scale i.z1{background:var(--c1)}.scale i.z2{background:var(--c2)}.scale i.z3{background:var(--c3)}
.scale i.zone{opacity:.75}
.scale i.me{opacity:1;outline:3px solid var(--ink);outline-offset:2px}
.scap{display:grid;grid-template-columns:3fr 3fr 3fr;direction:ltr;font-size:12.5px;color:var(--muted);text-align:center}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.confetti i{position:absolute;top:-14px;width:9px;height:15px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(600deg);opacity:.2}}

/* code peek */
.peek{background:var(--card);border-radius:24px;padding:18px;display:grid;gap:10px;animation:in .35s ease}
.peek h3{font-size:22px}
.peek p{margin:0;font-size:15px;color:var(--muted)}
.code{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:16px;padding:12px 0;direction:ltr;text-align:left;font-family:var(--f-code);font-size:13.5px;line-height:1.75;overflow-x:auto}
.code bdi{font-family:var(--f-body);unicode-bidi:isolate}
.tl{display:flex;align-items:center;gap:10px;padding:1px 16px;white-space:pre;opacity:.5;border-left:4px solid transparent}
.tl.on{opacity:1}.tl.ran{opacity:1;background:#ffffff12;border-left-color:#6FD3A5}
.b{font-family:var(--f-body);font-size:12px;font-weight:700;border-radius:999px;padding:0 10px;direction:rtl;unicode-bidi:isolate}
.b.t{background:#1E3A2E;color:#6FD3A5}.b.f{background:#3E2230;color:#FF8AB0}.b.r{background:#2E2945;color:#B9A8FF}
.kw{color:var(--c-kw);font-weight:600}.str{color:var(--c-str)}.fn{color:var(--c-fn)}.n{color:var(--c-num)}.com{color:var(--c-com);font-style:italic}
.credits{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.7}
.credits a{color:inherit}
.fact{background:var(--bg);border-radius:16px;padding:12px 14px;font-size:15.5px;display:grid;gap:2px}
.fact b{font-family:var(--f-display);font-weight:400;font-size:16px}
.photo img{background:#fff;object-position:50% 22%}
.collage img{object-position:50% 20%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- deck style: solid pink stage, dark speech bubbles, Secular One ---- */
:root{--stage:#FDB4C6;--bub:#37373A;--bub-fg:#FFFFFF;--bub-mute:#D9D3DC;--chip:#FFFFFF;--chip-fg:#2E2B33;--hi:#FFD3DF;--acc:#FF7D9C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#2B2228;--bub:#F7B9CA;--bub-fg:#25222A;--bub-mute:#4A3A42;--chip:#25222A;--chip-fg:#F5EFF3;--hi:#5A2638;--acc:#C2185B}}
:root[data-theme="dark"]{--stage:#2B2228;--bub:#F7B9CA;--bub-fg:#25222A;--bub-mute:#4A3A42;--chip:#25222A;--chip-fg:#F5EFF3;--hi:#5A2638;--acc:#C2185B}
body{background:var(--stage);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{color:#F5EFF3}}
.top b{font-size:22px}
.pts{background:var(--bub);color:var(--bub-fg);box-shadow:none}
.pts b{color:var(--acc)}
.card{position:relative;background:var(--bub);color:var(--bub-fg);border-radius:38px 46px 42px 34px;box-shadow:none;margin-bottom:34px}
.card::after{display:none;content:"";position:absolute;bottom:-30px;right:64px;width:42px;height:44px;background:var(--bub);clip-path:polygon(0 0,100% 0,30% 100%)}
.card.result{overflow:visible}
.card.result .photo{border-radius:38px 46px 0 0}
.eyebrow{color:var(--acc);letter-spacing:.04em}
.intro p,.qnum,.qfoot,.rbody .eyebrow{color:var(--bub-mute)}
.facts span{background:#ffffff1a;color:var(--bub-fg)}
.collage img{border-radius:24px;border-color:var(--stage);width:min(140px,40%);aspect-ratio:3/4;height:auto;object-position:50% 18%}
.collage{height:220px}
.collage img:nth-child(2){margin-left:-70px;top:0}
.qmark{display:none}
.btn.main{background:var(--stage);color:#2E2B33}
.btn.soft{background:#ffffff1a;color:var(--bub-fg)}
.btn.ghost{color:var(--bub-mute)}
.bar{background:#ffffff26}
.bar i{background:var(--stage)}
.qicon{background:var(--stage)}
.opt{background:var(--chip);color:var(--chip-fg);border:0;border-radius:20px}
.opt .nb{background:var(--bub)!important;color:var(--bub-fg);border-radius:50%;font-family:var(--f-display);font-size:19px}
.opt.picked{background:var(--hi)!important;box-shadow:0 0 0 3px var(--acc) inset}
.opt .pt{color:#6E6573}
.photo .badge{background:var(--bub);color:var(--bub-fg)}
.r1 h2,.r2 h2,.r3 h2{color:var(--bub-fg)}
.rbody p{color:var(--bub-fg)}
.fact{background:var(--stage);color:#2E2B33;border-radius:20px}
.traits span{background:#ffffff1a!important;color:var(--bub-fg)}
.scale i{color:#fff}
.scale i.z1,.scale i.z2,.scale i.z3{background:#ffffff40}
.scale i.zone{background:var(--acc);opacity:.6}
.scale i.me{background:var(--acc);opacity:1;outline-color:var(--bub-fg)}
.scap{color:var(--bub-mute)}
.peek{background:var(--bub);color:var(--bub-fg);border-radius:38px 46px 42px 34px}
.peek p{color:var(--bub-mute)}
.code{background:#232226}
.r2 .photo img{object-position:50% 0}
</style>
</head>

  const R = [
    { key:"plane", title:"את אודרי הפבורן!", short:"אודרי", cls:"r1", range:"4–6", text:"אלגנטית, נדיבה ואומנותית. את יודעת לרגש אנשים, ואכפת לך באמת מכל מי שסביבך. אודרי הפבורן נולדה בבלגיה ב־1929 וגדלה בהולנד. בזמן מלחמת העולם השנייה חוותה רעב, ובכל זאת המשיכה ללמוד בלט. אחרי המלחמה עברה ללונדון, ומשם הגיעה להוליווד. היא כיכבה בסרטים כמו \"חופשה ברומא\" ו\"ארוחת בוקר בטיפאני'ס\", והסטייל הפשוט שלה מעורר השראה עד היום. בשנים האחרונות לחייה הקדישה את רוב זמנה לעבודה כשגרירת רצון טוב של יוניסף. היא נסעה למדינות שסבלו ממלחמה ומרעב, כדי שהעולם ישמע על הילדים שחיים שם.", fact:"על התפקיד הראשי הגדול הראשון שלה, בסרט \"חופשה ברומא\" (1953), זכתה בפרס האוסקר.", traits:["אלגנטית","נדיבה","אומנותית"] },
    { key:"jungle", title:"את ג'יין גודול!", short:"ג'יין", cls:"r2", range:"7–9", text:"סבלנית, קשובה ואוהבת את הטבע. את שמה לב לפרטים שאחרים מפספסים. ג'יין גודול נולדה בלונדון ב־1934, וכבר כילדה חלמה לחיות עם חיות באפריקה. ב־1960 הגיעה ליער גומבה שבטנזניה בלי תואר אקדמי, רק עם מחברת, משקפת והרבה סבלנות. היא נתנה לשימפנזים שמות במקום מספרים, ולמדה להכיר כל אחד מהם. הגילוי שלה, ששימפנזים מכינים כלים, שינה את מה שמדענים חשבו על ההבדל בין בני אדם לבעלי חיים. כל חייה פעלה להגנה על הטבע.", fact:"היא חקרה שימפנזים בטנזניה במשך עשרות שנים, וגילתה שהם מכינים ומשתמשים בכלים.", traits:["סבלנית","חוקרת","אוהבת חיות"] },
    { key:"gears", title:"את עדה לאבלייס!", short:"עדה", cls:"r3", range:"10–12", text:"סקרנית וחושבת בהיגיון. את רוצה להבין איך דברים עובדים, ואז לגרום להם לעשות עוד. עדה לאבלייס נולדה בלונדון ב־1815. אמא שלה התעקשה שתלמד מתמטיקה ומדעים, דבר נדיר לבנות באותה תקופה. היא עבדה עם הממציא צ'רלס בבג', שתכנן מכונת חישוב ענקית בשם \"המנוע האנליטי\". עדה כתבה עבורה הוראות שלב אחר שלב לחישוב מספרים, ונחשבת בגלל זה למתכנתת הראשונה. היא גם הבינה משהו שאיש לא הבין אז: שמכונה כזאת תוכל יום אחד לעבוד גם עם מוזיקה ותמונות, לא רק עם מספרים.", fact:"ב־1843 היא כתבה את מה שנחשב לתוכנית המחשב הראשונה בעולם, עוד לפני שהיו מחשבים.", traits:["סקרנית","הגיונית","מתכנתת ראשונה"] }

  function question(){

      '<div class="qfoot"><span>אפשר גם ללחוץ 1, 2 או 3 במקלדת</span>' + (i ? '<button class="btn ghost" type="button" id="back">חזרה</button>' : '') + '</div></section>';
    screen.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => pick(Number(b.dataset.n))));
    if($("back")) $("back").addEventListener("click", () => { points -= answers.pop(); i--; setPts(0); question(); });
    try { screen.querySelector(".opt").focus({ preventScroll:true }); } catch(e){}
  }
  function pick(n){
    if(busy) return; busy = true;
    screen.querySelector('.opt[data-n="' + n + '"]').classList.add("picked");
    answers.push(n); points += n; setPts(n);
    setTimeout(() => { i++; i < Q.length ? question() : result(true); }, 520);
  }
  document.addEventListener("keydown", e => {

    const cols = ["#E8578C","#715CF3","#1F9E8A","#F2C94C","#FFB3C7"];
    for(let k = 0; k < 40; k++){ const s = document.createElement("i"); s.style.left = Math.random()*100 + "%"; s.style.background = cols[k % 5]; s.style.animationDelay = (Math.random()*.7) + "s"; s.style.animationDuration = (2 + Math.random()*1.4) + "s"; c.appendChild(s); }
    document.body.appendChild(c); setTimeout(() => c.remove(), 4200);
  }
  function result(party){
    const w = which(points), r = R[w];
    setPts(0);
    const scale = [4,5,6,7,8,9,10,11,12].map(n => { const z = n <= 6 ? 1 : n <= 9 ? 2 : 3; return '<i class="z' + z + (z === w + 1 ? " zone" : "") + (n === points ? " me" : "") + '">' + n + '</i>'; }).join("");
    screen.innerHTML = '<section class="card result ' + r.cls + '"><div class="photo"><img src="' + IMG[r.key] + '" alt=""><span class="badge">' + points + ' נקודות · טווח <bdi dir="ltr">' + r.range + '</bdi></span></div>' +
      '<div class="rbody"><span class="eyebrow">התוצאה שלך</span><h2>' + r.title + '</h2><p>' + r.text + '</p><div class="fact"><b>הידעת?</b>' + r.fact + '</div><div class="traits">' + r.traits.map(t => '<span>' + t + '</span>').join("") + '</div>' +
      '<div class="scale" aria-label="סקאלת נקודות">' + scale + '</div><div class="scap"><span>אודרי</span><span>ג\'יין</span><span>עדה</span></div>' +
      '<div class="actions"><button class="btn main" type="button" id="again">עוד פעם</button></div></div></section>' +
      '';
    $("again").addEventListener("click", intro);
    if(party) confetti();
  }

  // ---- code peek ----
  const heb = /[֐-׿]/;
  function hl(src){
    const e = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const re = /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*")|\b(var|if|else)\b|\b(prompt|alert|Number)\b|\b(\d+)\b/g;
    let out = "", last = 0, m;
    while((m = re.exec(src))){
      out += e(src.slice(last, m.index)); const t = m[0];
      if(m[1]) out += '<span class="com">//' + (heb.test(t) ? '<bdi dir="rtl">' + e(t.slice(2)) + '</bdi>' : e(t.slice(2))) + '</span>';
      else if(m[2]) out += '<span class="str">' + (heb.test(t) ? '<bdi dir="rtl">' + e(t) + '</bdi>' : e(t)) + '</span>';
      else if(m[3]) out += '<span class="kw">' + t + '</span>';
      else if(m[4]) out += '<span class="fn">' + t + '</span>';
      else out += '<span class="n">' + t + '</span>';
      last = m.index + t.length;
    }
    return out + e(src.slice(last));
  }
  function peek(p){
    const c1 = p <= 6, c2 = !c1 && p <= 9, run = which(p);
    const sum = answers.join(" + ");
    const L = [
      { t:'var points = 0;' },
      { t:'// ...4 שאלות, ואחרי כל אחת:' },
      { t:'points = points + answer;', b:'<span class="b r"><bdi dir="ltr">' + sum + ' = ' + p + '</bdi></span>', cls:"on" },
      { t:'' },
      { t:'if (points <= 6) {', cls:"on", b:'<span class="b ' + (c1 ? "t" : "f") + '"><bdi dir="ltr">' + p + ' &lt;= 6</bdi> ← ' + (c1 ? "נכון ✓" : "לא נכון ✗") + '</span>' },
      { t:'  alert("את אודרי הפבורן!");', cls: run === 0 ? "ran" : "", b: run === 0 ? '<span class="b r">רץ!</span>' : "" },
      { t:'} else if (points <= 9) {', cls: c1 ? "" : "on", b: c1 ? '<span class="b r">לא נבדק</span>' : '<span class="b ' + (c2 ? "t" : "f") + '"><bdi dir="ltr">' + p + ' &lt;= 9</bdi> ← ' + (c2 ? "נכון ✓" : "לא נכון ✗") + '</span>' },
      { t:'  alert("את ג\'יין גודול!");', cls: run === 1 ? "ran" : "", b: run === 1 ? '<span class="b r">רץ!</span>' : "" },
      { t:'} else {', cls: run === 2 ? "on" : "", b: run === 2 ? '<span class="b t">כל השאר ← לכאן</span>' : "" },
      { t:'  alert("את עדה לאבלייס!");', cls: run === 2 ? "ran" : "", b: run === 2 ? '<span class="b r">רץ!</span>' : "" },
      { t:'}' }
    ];
    return '<h3>מה המחשב עשה</h3><p>כל תשובה נוספה ל־points. אחר כך המחשב בדק את התנאים מלמעלה למטה, והראשון שהיה נכון קבע את התוצאה.</p>' +
      '<pre class="code">' + L.map(l => '<div class="tl ' + (l.cls || "") + '"><span>' + (l.t ? hl(l.t) : " ") + '</span>' + (l.b || "") + '</div>').join("") + '</pre>';
  }

  intro();
})();
</script>

</body>
</html>
